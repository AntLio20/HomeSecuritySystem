- id: '1785368264036'
  alias: Alarm Auto Disarm After 10 Minutes
  description: Automatically disarms the alarm if it has been sounding for 10 minutes.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarm_panel_pro_house_alarm
    to: triggered
  conditions: []
  actions:
  - delay:
      minutes: 10
  - condition: state
    entity_id: alarm_control_panel.alarm_panel_pro_house_alarm
    state: triggered
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.alarm_panel_pro_house_alarm
  mode: restart
- id: '1790805135916'
  alias: Alarm Open Sensor Tracker
  description: Maintains a list of all currently open alarm sensors
  triggers:
  - entity_id:
    - group.window_sensors
    - group.door_sensors
    trigger: state
  - trigger: homeassistant
    event: start
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.alarm_open_sensors
    data:
      value: "{% set open_sensors = [] %}\n{% if is_state('binary_sensor.konnected_front_door',
        'on') %}\n  {% set open_sensors = open_sensors + ['Front Door'] %}\n{% endif
        %}\n{% if is_state('binary_sensor.konnected_side_door', 'on')
        %}\n  {% set open_sensors = open_sensors + ['Side Door'] %}\n{% endif %}\n{%
        if is_state('binary_sensor.konnected_rear_door', 'on') %}\n  {%
        set open_sensors = open_sensors + ['Rear Door'] %}\n{% endif %}\n{% if is_state('binary_sensor.konnected_garage_door',
        'on') %}\n  {% set open_sensors = open_sensors + ['Garage Door'] %}\n{% endif
        %}\n{% if is_state('binary_sensor.konnected_upstairs_east_windows',
        'on') %}\n  {% set open_sensors = open_sensors + ['Upstairs East Windows']
        %}\n{% endif %}\n{% if is_state('binary_sensor.konnected_upstairs_west_windows',
        'on') %}\n  {% set open_sensors = open_sensors + ['Upstairs West Windows']
        %}\n{% endif %}\n{% if is_state('binary_sensor.konnected_downstairs_windows',
        'on') %}\n  {% set open_sensors = open_sensors + ['Downstairs Windows'] %}\n{%
        endif %}\n{{ open_sensors | join(', ') }}"
  mode: restart
