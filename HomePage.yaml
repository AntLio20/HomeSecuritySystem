            state_color: true
          - type: heading
            heading: Front Door
            heading_style: title
            grid_options:
              columns: 6
              rows: 1
          - type: heading
            heading: Driveway East
            heading_style: title
            grid_options:
              columns: 6
              rows: 1
          - type: tile
