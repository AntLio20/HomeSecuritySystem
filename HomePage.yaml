wallpanel:
  enabled: true
  idle_time: 30
  fullscreen: true
  hide_toolbar: false
  hide_sidebar: false
  camera_motion_detection_enabled: false
  cards:
    - type: vertical-stack
      cards:
        - type: custom:weather-card
          entity: weather.forecast_home
          name: null
          details: true
          forecast: true
          number_of_forecasts: 6
          tap_action:
            action: navigate
            navigation_path: /dashboard-home-phone
        - type: custom:hourly-weather
          entity: weather.forecast_home
          name: null
          num_segments: 12
          icons: true
          show_temperature: false
          tap_action:
            action: navigate
            navigation_path: /dashboard-home-phone
        - type: custom:clock-weather-card
          entity: weather.forecast_home
          title: King City
          time_pattern: HH:mm
          time_format: 24
          date_pattern: DDDD
          weather_icon_type: line
          animated_icon: true
          sun_entity: sun.sun
          forecast_rows: 5
          hide_clock: false
          hide_date: false
          show_decimal: false
          tap_action:
            action: navigate
            navigation_path: /dashboard-home-phone
views:
  - title: Home
    header:
      card:
        type: markdown
        content: "#Hello"
        text_only: true
    sections:
      - type: grid
        cards:
          - states:
              - arm_home
              - arm_away
            type: alarm-panel
            entity: alarm_control_panel.alarm_panel_pro_8d444c_house_alarm
            name: Home Alarm
          - type: heading
            heading_style: title
      - type: grid
        cards:
          - type: heading
            icon: mdi:window-closed
            heading: Windows
            heading_style: title
          - type: entities
            entities:
              - entity: binary_sensor.konnected_fce8c08d444c_downstairs_windows
                icon: mdi:window-closed
                name: Downstair Windows
              - entity: binary_sensor.konnected_fce8c08d444c_upstairs_west_windows
                name: Upstairs West Windows
              - entity: binary_sensor.konnected_fce8c08d444c_upstars_east_windows
                name: Upstairs East Windows
          - type: heading
            icon: mdi:door
            heading_style: title
            heading: Doors
          - type: entities
            entities:
              - entity: binary_sensor.konnected_fce8c08d444c_front_door
                name: Front Door
              - entity: binary_sensor.konnected_fce8c08d444c_garage_door
