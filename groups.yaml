door_sensors:
  name: Door Sensors
  entities:
    - binary_sensor.konnected_front_door
    - binary_sensor.konnected_side_door
    - binary_sensor.konnected_rear_door
    - binary_sensor.konnected_garage_door

window_sensors:
  name: Window Sensors
  entities:
    - binary_sensor.konnected_upstairs_east_windows
    - binary_sensor.konnected_upstairs_west_windows
    - binary_sensor.konnected_downstairs_windows

motion_sensors:
  name: Motion Sensors
  entities:
    - binary_sensor.konnected_upstairs_motion_sensor
    - binary_sensor.konnected_downstairs_motion_sensor

kiosks:
  name: Kiosks
  entities:
    - media_player.door_keypad
    - media_player.a12_kiosk
